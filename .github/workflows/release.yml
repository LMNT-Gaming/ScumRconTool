name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate tag and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $projectVersion = ([xml](Get-Content ScumRconTool.Wpf.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -ne $projectVersion) { throw 'Tag must match the project version.' }
          dotnet publish ScumRconTool.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o release
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          Compress-Archive -Path release/* -DestinationPath "RedRavenRconTool-$version-win-x64.zip"
      - name: Upload package to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          gh release create $tag "RedRavenRconTool-$version-win-x64.zip" --draft --verify-tag --title "Red Raven $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
